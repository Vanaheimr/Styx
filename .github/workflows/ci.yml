name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # windows-latest because that is where these tests are known to pass. Nothing
    # here looks platform-bound, so Linux is very likely fine and would be cheaper
    # - but it has not been tried, and a green badge should mean something.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build StyxTests/StyxTests.csproj --configuration Release

      - name: Test
        run: dotnet test StyxTests/StyxTests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
