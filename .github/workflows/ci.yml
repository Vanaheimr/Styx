name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow").
  workflow_dispatch:

concurrency:
  # Pull requests: one run per branch, newest wins — a run against a head
  # that has been superseded is answering a question nobody is asking any
  # more.
  #
  # Pushes: one run per commit, and nothing cancels anything. A commit with
  # no verdict is a hole nobody comes back to fill: the next commit contains
  # it, so the code does get tested eventually, but once that run is red
  # there is no longer any way to say which of the two commits did it.
  #
  # Keying the group on the SHA, rather than only turning cancel-in-progress
  # off, is what makes that hold for more than two pushes: a group keeps at
  # most one run *pending*, so a third push discards the second before it
  # ever starts.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # The same two-leg matrix as Hermod's gate: windows-latest, where these
    # tests have always run, and Debian 13 — where this code actually runs in
    # production. The old "Linux is very likely fine but has not been tried"
    # caveat is resolved: the full suite passed 147/147 on Debian 13 before
    # this leg was enabled. GitHub offers no Debian runner image, so the Linux
    # leg runs in a bare debian:13 container on an Ubuntu runner — the same
    # container Hermod uses, so both gates test the same platform pair.
    #
    # fail-fast is off on purpose: "red on exactly one platform" is the most
    # valuable signal this matrix produces, so one leg must not cancel the
    # other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7

      # The bare debian:13 container needs the .NET prerequisites before
      # setup-dotnet installs the SDK: curl for the dotnet-install script,
      # ICU and tzdata for globalization, OpenSSL for crypto, ca-certificates
      # for NuGet over HTTPS. Package names verified on Debian 13 (trixie).
      - name: Install .NET prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The specification's machine-readable conformance annex, executed by
      # SpecificationVectorTests. It lives with the specification rather than
      # here, so that a specification change and its vectors travel in one
      # commit; without it the suite reports itself ignored, and an ignored
      # conformance suite on CI would be a hole nobody comes back to fill.
      - name: Fetch the specification test vectors
        shell: bash
        run: |
          mkdir -p spec/test-vectors
          for f in values values-invalid documents json-to-cbor; do
            curl -fsSL -o "spec/test-vectors/$f.json" \
              "https://raw.githubusercontent.com/OpenChargingTechnology/Whitepapers/master/MetrologicalCBOR/test-vectors/$f.json"
          done

      - name: Build
        run: dotnet build StyxTests/StyxTests.csproj --configuration Release

      - name: Test
        run: dotnet test StyxTests/StyxTests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}.trx" --results-directory artifacts

      # The console log says whether the suite passed and very little else: which
      # test failed takes grepping the step log, a skip reason never reaches the
      # console at normal verbosity at all, and reading either needs a signed-in
      # browser session once the run is not the newest. TRX keeps outcome,
      # duration, error message, stack trace and the Assert.Ignore text per test,
      # and `gh run download` fetches it without a browser.
      #
      # This matters more here than the suite size suggests. Neither Hermod gate
      # pins Styx — both build against Styx master — so a red Hermod night can
      # originate in this repository, and the two artifacts are then directly
      # comparable because both name their files after the same two legs.
      #
      # !cancelled() rather than success(): a red run is when these files matter
      # most, and a build that fails before the test step leaves no .trx, which
      # upload-artifact reports as a warning rather than a second failure.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: artifacts/*.trx
